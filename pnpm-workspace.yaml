packages:
  - "."
  - "demo"

blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  '@sveltejs/kit': 2.70.3
  brace-expansion: 5.0.9
  cookie: 0.7.2
  dompurify: 3.4.14
  nanoid: 3.3.18
  postcss: 8.5.26
  sharp: 0.35.3
  vite: 8.2.2

peerDependencyRules:
  allowedVersions:
    "@lucide/svelte": "1"
