packages:
  - "."
  - "demo"

blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  '@sveltejs/kit': 2.70.1
  brace-expansion: 5.0.8
  cookie: 0.7.2
  dompurify: 3.4.12
  postcss: 8.5.23
  sharp: 0.35.3

peerDependencyRules:
  allowedVersions:
    "@lucide/svelte": "1"
